# Production stack. Run from the repo root:
#   docker compose -f docker/compose.prod.yml --env-file .env.production -p bueza-pets-prod up -d --build
#
# `db` is intentionally not published to the host — nothing outside these
# containers needs to reach Postgres directly. `backend`/`frontend` join the
# external `odoo-network` in addition to their own private network so the
# host's shared nginx (which fronts other projects on this box) can reach
# them by container name, the same way it already reaches `odoo` and
# `pet-matchmaking`.

services:
  db:
    image: postgres:16-alpine
    container_name: bueza-pets-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - bueza_pets_prod_postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    container_name: bueza-pets-backend-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - odoo-network
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../frontend
    container_name: bueza-pets-frontend-prod
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://backend:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3010:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      - odoo-network
    mem_limit: 512m

networks:
  internal:
    name: bueza-pets-prod-network
  odoo-network:
    external: true

volumes:
  bueza_pets_prod_postgres_data:
    name: bueza_pets_prod_postgres_data
