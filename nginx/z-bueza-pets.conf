# Bueza Pets — app.bueza.in / api.bueza.in / staging.app.bueza.in / staging.api.bueza.in
#
# Lives alongside default.conf (Odoo/bueza.in) and n8n.conf in the same
# odoo16-nginx container's /etc/nginx/conf.d/ — pure addition, no existing
# server block is touched. Backends are reached by container name over the
# shared `odoo-network` (frontend/backend containers from compose.prod.yml
# and compose.staging.yml join it explicitly for this reason).
#
# Filename prefixed "z-" so it loads AFTER default.conf/n8n.conf: nginx
# picks its default_server (used for requests with no matching Host
# header) from whichever conf.d file loads first when none is explicitly
# marked, and this file has no reason to change that pre-existing behavior.
#
# Deployed via: scripts/setup-ssl.sh (handles the cert bootstrap sequence
# below correctly). Manual equivalent:
#   docker cp nginx/z-bueza-pets.conf odoo16-nginx:/etc/nginx/conf.d/z-bueza-pets.conf
#   docker exec odoo16-nginx nginx -t && docker exec odoo16-nginx nginx -s reload
#
# NOTE ON FIRST-TIME SETUP: the https server blocks below reference certs
# that don't exist until certbot has run once. Deploying this file as-is
# before that will fail `nginx -t` (missing cert files) and refuses to
# reload — which is the safe failure mode, but means first deploy must be
# the http-only half of this file (see scripts/setup-ssl.sh), then
# certbot, then the full file below.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream bueza_pets_app_prod {
    server bueza-pets-frontend-prod:3000;
    keepalive 32;
}

upstream bueza_pets_api_prod {
    server bueza-pets-backend-prod:8000;
    keepalive 32;
}

upstream bueza_pets_app_staging {
    server bueza-pets-frontend-staging:3000;
    keepalive 16;
}

upstream bueza_pets_api_staging {
    server bueza-pets-backend-staging:8000;
    keepalive 16;
}

# ---- HTTP: ACME challenges + redirect to HTTPS, for all four hosts ----

server {
    listen 80;
    listen [::]:80;
    server_name app.bueza.in api.bueza.in staging.app.bueza.in staging.api.bueza.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- app.bueza.in (production frontend) ----

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.bueza.in;

    ssl_certificate /etc/letsencrypt/live/bueza-pets/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bueza-pets/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:bueza_pets_ssl:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
        text/javascript application/xml text/xml image/svg+xml font/woff2 font/woff;

    client_max_body_size 20M;

    location / {
        proxy_pass http://bueza_pets_app_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        proxy_pass http://bueza_pets_app_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }
}

# ---- api.bueza.in (production backend) ----

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.bueza.in;

    ssl_certificate /etc/letsencrypt/live/bueza-pets/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bueza-pets/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:bueza_pets_ssl:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/plain;

    client_max_body_size 20M;

    location / {
        proxy_pass http://bueza_pets_api_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

